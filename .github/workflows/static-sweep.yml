# Daily sweep of the 115+ static Vercel sites (specs/003-static-sweep/spec.md). The Worker cannot
# probe them (50 subrequests per run on the free plan), so a GitHub-hosted runner checks each one
# once a day, sends one Telegram message listing the sites that are down, and posts heartbeat
# `static-sweep`, which the Worker watches (26 h). The site list is generated by the solo-empire
# coverage registry (interface_coverage.py --export-static).
name: Static sweep

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Check every static site
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/static-sweep.ts
