name = "solo-empire-monitor"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
account_id = "4a3ba0eee7dba5c9131a0d1ad3639114"

# Two cron triggers, one per shard (see SHARD_CRONS in src/worker.ts): each runs every 5 minutes,
# offset by 2 minutes, and checks half of the targets.
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *"]

# KV namespace for storing status data
[[kv_namespaces]]
binding = "MONITOR_KV"
id = "MONITOR_KV_NAMESPACE_ID"  # Will be created via wrangler

# Enable workers.dev subdomain
workers_dev = true
