name = "solo-empire-monitor"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
account_id = "98e152b05e32b75612ee03e955913ee2"

# Public at https://solo-empire-monitor.bookchaowalit.workers.dev
workers_dev = true

# Two cron triggers, one per shard (see SHARD_CRONS in src/worker.ts): each runs every 5 minutes,
# offset by 2 minutes, and checks half of the targets.
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *"]

# Target state and job heartbeats.
[[kv_namespaces]]
binding = "MONITOR_KV"
id = "214d9f79913b4f18ad80e942836844b3"
