name = "solo-empire-monitor"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
# @sentry/cloudflare imports node:async_hooks (AsyncLocalStorage); nodejs_als exposes only that module.
compatibility_flags = ["nodejs_als"]
account_id = "98e152b05e32b75612ee03e955913ee2"

# Public at https://monitor.bookchaowalit.com (Worker custom domain, 2026-11-04). The workers.dev
# route is off since 2026-11-04 (network NET-10): every heartbeat and status caller uses the custom domain.
workers_dev = false
routes = [{ pattern = "monitor.bookchaowalit.com", custom_domain = true }]

# Two cron triggers, one per shard (see SHARD_CRONS in src/worker.ts): each runs every 5 minutes,
# offset by 2 minutes, and checks half of the targets.
[triggers]
crons = ["*/5 * * * *", "2-59/5 * * * *", "*/10 1 * * *"]  # the last one: daily gateway report (retries within 01:xx)

# Target state and job heartbeats.
[[kv_namespaces]]
binding = "MONITOR_KV"
id = "214d9f79913b4f18ad80e942836844b3"

[vars]
# Daily edge gateway report (src/gateway-report.ts); the token is the secret GATEWAY_REPORT_CF_TOKEN.
GATEWAY_REPORT_ZONE_ID = "8279099075e766aa61998872b5d0d3d3"
